name: mafc-nav 停更巡检与自动重启

# 自调度链兜底（双判据，与 all-weather-nav 同一思路但完全独立）：
#   1) 链路停更：距最近一次巡检记录 > 26h → force 重启 mafc-daily-sync.yml
#   2) 数据过期：data/model_state.json 的 as_of 距今 >= 3 个自然日（收盘后基准 15:00 CST）
#      → 且距最近巡检 > 6h 冷却，避免 3h 巡检周期连续触发
# 本工作流只作用于本仓库 mafc-nav，不会触发或改动 all-weather-nav。

on:
  schedule:
    # 与 all-weather-nav 的 watchdog（40 */3）错峰 10 分钟
    - cron: '50 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: 检查链路时效与数据新鲜度并按需重启
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const H = 3.6e6, DAY = 24 * H;
            const now = Date.now();
            let hours = Infinity, staleDays = NaN, asOf = '未知';
            const notes = [];

            const readJson = async (path) => {
              const {data} = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            };

            // 判据 1：链路时效（距最近一次同步巡检记录 output/sync_run.json）
            try {
              const r = await readJson('output/sync_run.json');
              const at = r.generated_at || r.as_of;
              if (at) hours = (now - new Date(at.replace(' ', 'T') + '+08:00').getTime()) / H;
              notes.push(`距上次同步 ${Number.isFinite(hours) ? hours.toFixed(1) + 'h' : '未知'}`);
            } catch (e) {
              notes.push('sync_run 读取失败: ' + e.message);
            }

            // 判据 2：数据新鲜度（模型接口 as_of，基准当日 15:00 CST 收盘）
            try {
              const m = await readJson('data/model_state.json');
              asOf = m.as_of_date;
              const asOfMs = new Date(asOf + 'T07:00:00Z').getTime();
              staleDays = (now - asOfMs) / DAY;
              notes.push(`模型 as_of=${asOf} 距今 ${Number.isFinite(staleDays) ? staleDays.toFixed(1) + 'd' : '未知'}`);
            } catch (e) {
              notes.push('model_state 读取失败: ' + e.message);
            }

            const chainStale = !Number.isFinite(hours) || hours > 26;
            const dataStale = Number.isFinite(staleDays) && staleDays >= 3;
            const cooled = hours > 6;
            const msg = notes.join(' | ');

            if (chainStale || (dataStale && cooled)) {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo,
                workflow_id: 'mafc-daily-sync.yml', ref: 'main',
                inputs: { no_refresh: 'false' }
              });
              core.notice(`检出${chainStale ? '链路停更' : '数据过期'}（${msg}），已 workflow_dispatch 重启 mafc-daily-sync`);
            } else {
              core.info(`mafc-nav 同步链正常：${msg}（停更阈值 26h / 数据过期 3d）`);
            }
